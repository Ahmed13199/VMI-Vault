{% extends "base.html" %}

{% block title %}{% if deal %}Edit Deal{% else %}New Deal{% endif %} - Experience Team{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if deal %}Edit Deal{% else %}New Deal{% endif %}</h1>
    <p class="page-subtitle">Track deals that need Engineering or Fabrication</p>
</div>

<div class="actions-bar">
    <a href="{{ url_for('experience_team.index') }}" class="btn btn-secondary">Back</a>
</div>

<section class="form-container">
    <form method="post" action="{% if deal %}{{ url_for('experience_team.edit_deal', deal_id=deal.id) }}{% else %}{{ url_for('experience_team.create_deal') }}{% endif %}">
        <div class="form-group">
            <label for="deal_name">Deal Name</label>
            <input id="deal_name" name="deal_name" type="text" required value="{{ form_data.get('deal_name', '') }}">
        </div>

        <div class="form-group">
            <label for="client_name">Client Name (optional)</label>
            <input id="client_name" name="client_name" type="text" value="{{ form_data.get('client_name', '') }}">
        </div>

        <div class="form-group">
            <label for="step_type">Step Type</label>
            <select id="step_type" name="step_type" required>
                {% set selected_step = (form_data.get('step_type') or 'engineering') %}
                <option value="engineering" {% if selected_step == 'engineering' %}selected{% endif %}>Engineering</option>
                <option value="fabrication" {% if selected_step == 'fabrication' %}selected{% endif %}>Fabrication</option>
            </select>
        </div>

        <div class="form-group">
            <label for="client_paid_so_far">Client Paid So Far</label>
            <input id="client_paid_so_far" name="client_paid_so_far" type="number" step="0.01" min="0" value="{{ form_data.get('client_paid_so_far', '0') }}">
        </div>

        <div class="form-group">
            <label for="step_cost">Step Cost</label>
            <input id="step_cost" name="step_cost" type="number" step="0.01" min="0" value="{{ form_data.get('step_cost', '0') }}">
        </div>

        <div class="form-group">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" rows="4">{{ form_data.get('notes', '') }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{% if deal %}Save{% else %}Create Deal{% endif %}</button>
        </div>
    </form>
</section>
{% endblock %}
