{% extends "base.html" %}

{% block title %}Create Journal Table{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create Table</h1>
    <p class="page-subtitle">Choose table size, then rename rows/columns inside the editor.</p>
</div>

<div class="form-container">
    <form method="POST" action="{{ url_for('journal.create_table') }}" class="data-entry-form">
        <div class="form-group">
            <label for="name">Table name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Weekly Notes" required>
        </div>

        <div class="form-group">
            <label for="rows">Rows</label>
            <input type="number" id="rows" name="rows" min="1" max="50" value="10" required>
        </div>

        <div class="form-group">
            <label for="cols">Columns</label>
            <input type="number" id="cols" name="cols" min="1" max="20" value="5" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create</button>
            <a class="btn btn-secondary" href="{{ url_for('journal.index') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
